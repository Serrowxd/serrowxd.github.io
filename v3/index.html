.in-mk text{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .5s ease .15s}

/* dust-text sections: hit areas + summoned annotation (no cards) */
#hits{position:fixed;inset:0;z-index:12;pointer-events:none}
#hits .dt-text{position:fixed;display:none;transform-origin:0 0;font-family:var(--mono);white-space:nowrap;line-height:1.15;padding:0 0.1em;text-decoration:none;color:var(--gold);text-shadow:0 0 10px rgba(242,200,121,.3);opacity:0;pointer-events:none;cursor:default;transition:opacity .3s}
#hits .dt-text.title{color:var(--ink);text-shadow:0 0 16px rgba(242,200,121,.22)}
#hits .dt-text.hit{cursor:pointer}
#hits .dt-text.hit:hover{color:#fff;opacity:.85!important;text-shadow:0 0 14px rgba(242,200,121,.6)}
.dt-eyebrow{position:fixed;font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 0 8px rgba(0,0,0,.9)}
#annot{position:fixed;z-index:13;width:320px;transform:translateY(-50%);background:rgba(7,6,3,.86);border:1px solid rgba(242,200,121,.28);padding:14px 16px 12px;font-family:var(--mono);opacity:0;pointer-events:none;transition:opacity .25s ease;backdrop-filter:blur(2px)}
#annot.on{opacity:1;pointer-events:auto}
#annot::before,#annot::after{content:"";position:absolute;width:7px;height:7px;border:1px solid rgba(242,200,121,.85)}
#annot::before{top:-1px;left:-1px;border-right:0;border-bottom:0}#annot::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#annot .ae{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--steel-dim)}#annot .ae b{color:var(--cyan);font-weight:500}
#annot .an{font-size:15px;letter-spacing:.08em;color:var(--ink);margin:6px 0 6px;font-weight:600}
#annot .al{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--steel)}
#annot .aa{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-decoration:none}
#annot .aa:hover{text-shadow:0 0 10px rgba(242,200,121,.6)}
body.inside #hits,body.inside #annot{display:none!important}
</style>
</head>
